rules:
  - id: no-console-log-in-production
    languages: [typescript]
    message: Avoid console.log in production code.
    severity: WARNING
    patterns:
      - pattern: console.log(...)
      - pattern-not-inside: |
          if (import.meta.env.DEV) {
            console.log(...)
          }
  - id: no-direct-web-fetch
    languages: [typescript]
    message: Use the centralized API client in apps/web/src/api.ts instead of calling fetch directly.
    severity: ERROR
    paths:
      include:
        - /apps/web/src/**/*.ts
        - /apps/web/src/**/*.tsx
      exclude:
        - /apps/web/src/api.ts
    patterns:
      - pattern: fetch(...)
  - id: no-eval
    languages: [typescript]
    message: Avoid dynamic code execution with eval.
    severity: ERROR
    paths:
      include:
        - '**/*.ts'
        - '**/*.tsx'
    pattern: eval(...)
  - id: no-new-function
    languages: [typescript]
    message: Avoid dynamic code execution with the Function constructor.
    severity: ERROR
    paths:
      include:
        - '**/*.ts'
        - '**/*.tsx'
    pattern: new Function(...)
