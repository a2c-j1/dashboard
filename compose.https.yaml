services:
  api:
    command: npm run dev:https -w @dashboard/api
    environment:
      TLS_CERT: /workspaces/dashboard/.certs/localhost.pem
      TLS_KEY: /workspaces/dashboard/.certs/localhost-key.pem

  web:
    command: sh -c 'npm run build -w @dashboard/schemas && npm run dev:https -w @dashboard/web -- --host 0.0.0.0'
    environment:
      HTTPS: '1'
      VITE_API_PROXY_TARGET: https://api:8787
